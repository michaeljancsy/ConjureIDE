		AABB00032F5013850036AAB6 /* Copy Python Dylib */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(SRCROOT)/rust/python-dist/lib/libpython3.14t.dylib",
			);
			name = "Copy Python Dylib";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libpython3.14t.dylib",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "# Copy libpython3.14t.dylib into Frameworks (required for pyo3 @rpath loading).\n# The Python stdlib is no longer bundled here — it lives in the App Group container,\n# provisioned by ConjureDSPTerminal.\nset -euo pipefail\n\nSRC_DYLIB=\"${SRCROOT}/rust/python-dist/lib/libpython3.14t.dylib\"\nDST_DYLIB=\"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libpython3.14t.dylib\"\n\nif [ ! -f \"$SRC_DYLIB\" ]; then\n    echo \"error: $SRC_DYLIB not found. Run rust/setup-python.sh first.\" >&2\n    exit 1\nfi\n\nmkdir -p \"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\n\n# Fast path: skip the copy when source is unchanged.\nif [ ! -f \"$DST_DYLIB\" ] || [ \"$SRC_DYLIB\" -nt \"$DST_DYLIB\" ]; then\n    cp \"${SRC_DYLIB}\" \"${DST_DYLIB}\"\nfi\n\n# Always re-sign with the project's code-sign identity. python-build-standalone\n# ships libpython adhoc-signed; codesign --verify passes on adhoc, so a\n# conditional re-sign would never fire and the dylib would reach notarization\n# adhoc-signed (this broke 2.0.0 build 18's first notarization attempt).\n# Force-sign every build — codesign --force is cheap.\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp \"${DST_DYLIB}\"\n";
		};
		AABB00092F5013850036AAB6 /* Copy Rust Compiler */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Copy Rust Compiler";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "# Copy bundled Rust compiler into the extension bundle for sandbox-safe compilation\nRUSTC_SRC=\"${SRCROOT}/rustc-dist\"\n\nif [ ! -d \"${RUSTC_SRC}\" ]; then\n    # In a git worktree, run the setup script to create symlinks\n    \"${SRCROOT}/scripts/setup-worktree.sh\" >&2 || true\nfi\n\nif [ ! -d \"${RUSTC_SRC}\" ]; then\n    echo \"warning: Bundled Rust compiler not found at ${RUSTC_SRC}. Run scripts/setup-rustc.sh first.\" >&2\n    echo \"warning: Rust compilation will only work with user-installed rustc (not in sandboxed DAWs).\" >&2\n    exit 0\nfi\n\nRUSTC_DST=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/rustc-dist\"\nSTAMP=\"${RUSTC_DST}/.copy-stamp\"\n\n# Skip if Rust compiler AND conjuredsp sources haven't changed since last copy\nif [ -f \"$STAMP\" ] && [ \"${RUSTC_SRC}/bin/rustc\" -ot \"$STAMP\" ]; then\n    RLIB_STALE=0\n    for f in \"${SRCROOT}\"/rust/conjuredsp-rs/src/*.rs; do\n        if [ \"$f\" -nt \"$STAMP\" ]; then\n            RLIB_STALE=1\n            break\n        fi\n    done\n    if [ \"${RLIB_STALE}\" -eq 0 ]; then\n        echo \"note: Rust compiler and conjuredsp unchanged, skipping copy\" >&2\n        exit 0\n    fi\n    echo \"note: conjuredsp sources changed, rebuilding rlib\" >&2\nfi\n\n# Copy the sysroot\nmkdir -p \"${RUSTC_DST}\"\nrsync -aL --delete \"${RUSTC_SRC}/\" \"${RUSTC_DST}/\"\n\n# Code-sign all executables and dylibs\n# rustc needs disable-library-validation to dlopen proc-macro dylibs compiled by cargo\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp --entitlements \"${SRCROOT}/scripts/rustc-entitlements.plist\" \"${RUSTC_DST}/bin/rustc\"\nfind \"${RUSTC_DST}/lib\" -name '*.dylib' -exec codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp {} \\;\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp \"${RUSTC_DST}/lib/rustlib/aarch64-apple-darwin/bin/rust-lld\"\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp \"${RUSTC_DST}/lib/rustlib/aarch64-apple-darwin/bin/gcc-ld/wasm-ld\"\n\n# Rebuild conjuredsp rlib if source is newer than compiled rlib\nCONJUREDSP_SRC=\"${SRCROOT}/rust/conjuredsp-rs/src/lib.rs\"\nCONJUREDSP_RLIB=\"${RUSTC_DST}/lib/libconjuredsp.rlib\"\nif [ -f \"${CONJUREDSP_SRC}\" ]; then\n    NEEDS_REBUILD=0\n    if [ ! -f \"${CONJUREDSP_RLIB}\" ]; then\n        NEEDS_REBUILD=1\n    else\n        for f in \"${SRCROOT}\"/rust/conjuredsp-rs/src/*.rs; do\n            if [ \"$f\" -nt \"${CONJUREDSP_RLIB}\" ]; then\n                NEEDS_REBUILD=1\n                break\n            fi\n        done\n    fi\n    if [ \"${NEEDS_REBUILD}\" -eq 1 ]; then\n        echo \"note: Rebuilding conjuredsp rlib\" >&2\n        \"${RUSTC_DST}/bin/rustc\" \\\n            --target wasm32-wasip1 --edition 2024 --crate-type rlib \\\n            --crate-name conjuredsp -C opt-level=2 \\\n            --sysroot \"${RUSTC_DST}\" \\\n            -o \"${CONJUREDSP_RLIB}\" \\\n            \"${CONJUREDSP_SRC}\"\n    fi\nfi\n\ntouch \"$STAMP\"\n";
		};
