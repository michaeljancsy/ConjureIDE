			shellPath = /bin/bash;
			shellScript = "# Skip if Python runtime hasn't changed since last copy\nPYDST=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/python-dist\"\nSTAMP=\"${PYDST}/.copy-stamp\"\nSRC_DYLIB=\"${SRCROOT}/rust/python-dist/lib/libpython3.14t.dylib\"\nDST_DYLIB=\"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libpython3.14t.dylib\"\n\nif [ -f \"$STAMP\" ] && [ -f \"$DST_DYLIB\" ] && [ \"$SRC_DYLIB\" -ot \"$STAMP\" ]; then\n    echo \"note: Python runtime unchanged, skipping copy\" >&2\n    exit 0\nfi\n\n# Copy Python dylib into Frameworks\nmkdir -p \"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\ncp \"${SRC_DYLIB}\" \"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/\"\n\n# Code-sign the dylib with the same identity as the build\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp \"${DST_DYLIB}\"\n\n# Copy Python stdlib + site-packages into Resources/python-dist\nmkdir -p \"${PYDST}/lib\"\ncp -R \"${SRCROOT}/rust/python-dist/lib/python3.14t\" \"${PYDST}/lib/\"\n\n# Code-sign all .so files (numpy, stdlib extensions) for hardened runtime\nfind \"${PYDST}\" -name '*.so' -exec codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp {} \\;\n\ntouch \"$STAMP\"\n";
