name: BearBoneExportAUTemplate
options:
  bundleIdPrefix: com.BearBone-user
  deploymentTarget:
    macOS: "26.2"
  xcodeVersion: "16.3"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: A4R63LAVLS

targets:
  BearBoneExportAUTemplate:
    type: application
    platform: macOS
    sources:
      - path: BearBoneExportAUTemplate
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.BearBone-user.ExportTemplate
        CODE_SIGN_ENTITLEMENTS: BearBoneExportAUTemplate/BearBoneExportAUTemplate.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BearBoneExportAUTemplateExtension
        embed: true
        codeSign: true

  BearBoneExportAUTemplateExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: BearBoneExportAUTemplateExtension
        excludes:
          - "*.entitlements"
    info:
      path: BearBoneExportAUTemplateExtension/Info.plist
      properties:
        CFBundleDisplayName: BearBoneExportAUTemplateExtension
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionAttributes:
            AudioComponents:
              - description: BearBone Export
                factoryFunction: $(PRODUCT_MODULE_NAME).ExportAUViewController
                manufacturer: BEAR
                name: "BearBone: ExportTemplate"
                sandboxSafe: true
                subtype: TMPL
                tags:
                  - Effect
                type: aufx
                version: 1
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ExportAUViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.BearBone-user.ExportTemplate.Extension
        CODE_SIGN_ENTITLEMENTS: BearBoneExportAUTemplateExtension/BearBoneExportAUTemplateExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: BearBoneExportAUTemplateExtension/Common/ExportAUBridgingHeader.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../rust/include"
        LIBRARY_SEARCH_PATHS:
          - "$(BUILT_PRODUCTS_DIR)"
          - "$(SRCROOT)/../rust/python-dist/lib"
        OTHER_LDFLAGS:
          - "-lbearbone_dsp"
          - "-lpython3.14t"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
          - "@loader_path/../Frameworks"
    preBuildScripts:
      - name: Build Rust
        script: |
          cd "${SRCROOT}/../rust"
          bash build-rust.sh
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/libbearbone_dsp.a"
    postBuildScripts:
      - name: Copy Python Dylib
        script: |
          FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "${FRAMEWORKS_DIR}"

          PYTHON_LIB="${SRCROOT}/../rust/python-dist/lib/libpython3.14t.dylib"
          if [ -f "${PYTHON_LIB}" ]; then
              cp "${PYTHON_LIB}" "${FRAMEWORKS_DIR}/"
              if [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ]; then
                  codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
                      "${FRAMEWORKS_DIR}/libpython3.14t.dylib"
              fi
          else
              echo "warning: libpython3.14t.dylib not found at ${PYTHON_LIB}" >&2
          fi
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libpython3.14t.dylib"

  BearBoneExportAUTemplateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BearBoneExportAUTemplateTests
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: BearBoneExportAUTemplateExtension/Common/ExportAUBridgingHeader.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../rust/include"
        LIBRARY_SEARCH_PATHS:
          - "$(BUILT_PRODUCTS_DIR)"
          - "$(SRCROOT)/../rust/python-dist/lib"
        OTHER_LDFLAGS:
          - "-lbearbone_dsp"
          - "-lpython3.14t"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../rust/python-dist/lib"
          - "@loader_path/../../../BearBoneExportAUTemplateExtension.appex/Contents/Frameworks"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BearBoneExportAUTemplate.app/Contents/MacOS/BearBoneExportAUTemplate"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BearBoneExportAUTemplate

schemes:
  BearBoneExportAUTemplate:
    build:
      targets:
        BearBoneExportAUTemplate: all
        BearBoneExportAUTemplateExtension: all
        BearBoneExportAUTemplateTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BearBoneExportAUTemplateTests
