<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="xterm.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #terminal-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #terminal { width: 100%; height: 100%; }

        /* Connection status overlay */
        #status-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #status-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #status-overlay .status-text {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            color: #888;
        }
        #status-overlay .status-hint {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 12px;
            color: #666;
        }

        /* Override xterm background for transparency */
        .xterm { background: transparent !important; }

        /* Reposition xterm.js's hidden textarea over the terminal area.
           By default xterm.js places it at left:-9999em, which means WebKit
           doesn't recognize the terminal as an editable surface and won't
           make the WKWebView first responder on click. Placing it over the
           terminal (transparent, full-size) triggers WebKit's text input
           mode so the WKWebView claims first responder like Monaco does. */
        .xterm-helper-textarea {
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
            width: 100% !important;
            height: 100% !important;
            opacity: 0 !important;
            z-index: 5 !important;
        }
    </style>
</head>
<body>
    <div id="terminal-container">
        <div id="terminal"></div>
        <div id="status-overlay">
            <div class="status-text" id="status-text">Connecting...</div>
            <div class="status-hint" id="status-hint"></div>
        </div>
    </div>

    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script src="addon-web-links.js"></script>
    <script src="terminal-bridge.js"></script>
</body>
</html>
