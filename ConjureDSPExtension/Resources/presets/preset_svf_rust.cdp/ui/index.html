<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>State Variable Filter</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font: 12px -apple-system, system-ui, sans-serif;
      background: Canvas; color: CanvasText;
    }
    body {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 14px 16px; gap: 6px; box-sizing: border-box;
    }
    /* Show a loading indicator until `CDP.ready` lands. On Rust-backed
       presets the first-time WASM compile can take several seconds, so
       the UI would otherwise sit blank and look broken. */
    body.cdp-loading > #content { display: none; }
    body:not(.cdp-loading) > #cdp-loader { display: none; }
    #cdp-loader {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 10px; color: color-mix(in srgb, CanvasText 55%, transparent);
      text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.8em;
    }
    #cdp-loader .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: color-mix(in srgb, CanvasText 40%, transparent);
      animation: cdp-pulse 1.2s ease-in-out infinite;
    }
    @keyframes cdp-pulse {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    #content { display: contents; }
    .title {
      font-weight: 600; letter-spacing: 0.02em;
      text-transform: uppercase; font-size: 0.75em; opacity: 0.55;
    }
    canvas {
      width: 100%; height: 120px; display: block;
      border-radius: 6px;
      background: color-mix(in srgb, CanvasText 6%, Canvas);
    }
    /* Pad: spans the full width, non-square, so cutoff (its X axis)
       lines up with the frequency-response canvas above. */
    cdp-xy { display: block; width: 100%; }
    cdp-xy::part(pad) {
      aspect-ratio: auto;
      max-width: none;
      width: 100%;
      height: 180px;
    }
    .axis {
      display: grid;
      grid-template-columns: auto 1fr auto;
      font-size: 0.85em; opacity: 0.6;
      align-items: center;
    }
    .axis .mid { text-align: center; }
  </style>
</head>
<body class="cdp-loading">
  <div id="cdp-loader">
    <div class="dot"></div>
    <div>Loading…</div>
  </div>
  <div id="content">
    <div class="title">Frequency response</div>
    <canvas id="response" width="800" height="240"></canvas>
    <cdp-xy param-x="cutoff" param-y="resonance" invert-y></cdp-xy>
    <div class="axis">
      <span>20 Hz</span>
      <span class="mid">Cutoff  •  Q ↑</span>
      <span>20 kHz</span>
    </div>
  </div>
  <script>
  (function () {
    const CDP = window.ConjureDSP;
    const canvas = document.getElementById('response');
    const ctx = canvas.getContext('2d');
    const SR = 48000;

    function idxOf(key) {
      // Case-insensitive so this UI serves both Python (lowercase)
      // and Rust (uppercase from params!()) variants.
      const low = String(key).toLowerCase();
      for (let i = 0; i < CDP.parameters.count; i++) {
        const m = CDP.parameters.metadata(i);
        if (!m) continue;
        if ((m.name && m.name.toLowerCase() === low) ||
            (m.key && m.key.toLowerCase() === low)) return i;
      }
      return -1;
    }

    // TPT SVF magnitude response (LP output). See Zavalishin; lp/bp/hp
    // are all exact with this topology so magnitude mirrors what the
    // preset actually produces.
    function lpMagnitudeDb(f0, Q, f) {
      const g = Math.tan(Math.PI * f0 / SR);
      const k = 1 / Q;
      const wt = Math.tan(Math.PI * f / SR);
      const gg = g * g;
      const re = gg - wt * wt;
      const im = k * g * wt;
      return 10 * Math.log10(gg * gg / (re * re + im * im));
    }

    // Canvas 2D can't parse `color-mix()` or the `CanvasText` keyword,
    // so we pick explicit rgb() colors keyed off `CDP.theme` and use
    // `globalAlpha` for transparency.
    function resolveFG() {
      return (CDP && CDP.theme === 'dark') ? 'rgb(232, 232, 232)' : 'rgb(24, 24, 24)';
    }
    let FG = resolveFG();
    window.addEventListener('themechange', () => { FG = resolveFG(); schedule(); });

    function drawResponse() {
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;
      if (w === 0 || h === 0) return;
      ctx.clearRect(0, 0, w, h);
      const pad = 6 * devicePixelRatio;
      const iw = w - pad * 2, ih = h - pad * 2;

      // Y-axis spans -24..+24 dB so high-Q resonance peaks (up to
      // ~20 log10(Q) dB of boost at cutoff for Q=10, ~20 dB) fit
      // without getting clipped off the top of the canvas.
      const DB_MIN = -24, DB_MAX = 24;
      const dbRange = DB_MAX - DB_MIN;
      const yForDb = (db) => pad + ih * (1 - (db - DB_MIN) / dbRange);

      // Horizontal dB grid.
      ctx.strokeStyle = FG;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.12;
      [-24, -12, 0, 12, 24].forEach(db => {
        const y = yForDb(db);
        ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
      });
      ctx.globalAlpha = 1;

      const fMin = 20, fMax = 20000;
      const cutoff = CDP.parameters.get(idxOf('cutoff'));
      const Q = CDP.parameters.get(idxOf('resonance'));
      const fClamped = Math.max(20, Math.min(SR * 0.49, cutoff));

      // LP magnitude curve.
      ctx.beginPath();
      const N = 256;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const f = fMin * Math.pow(fMax / fMin, t);
        const db = Math.max(DB_MIN, Math.min(DB_MAX, lpMagnitudeDb(fClamped, Q, f)));
        const x = pad + t * iw;
        const y = yForDb(db);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = FG;
      ctx.lineWidth = 2 * devicePixelRatio;
      ctx.stroke();

      // Cutoff marker — log-frequency, so its X position on the canvas
      // matches the puck's X position on the pad below (which uses the
      // same log curve via param metadata).
      const tCut = Math.log(fClamped / fMin) / Math.log(fMax / fMin);
      const xCut = pad + tCut * iw;
      ctx.strokeStyle = FG;
      ctx.globalAlpha = 0.35;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(xCut, pad); ctx.lineTo(xCut, h - pad); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    let raf = 0;
    function schedule() {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; drawResponse(); });
    }

    // Remove the loading overlay only when metadata is actually
    // populated. CDP.ready fires on the first `_init`, but Swift
    // sends that as soon as the bridge posts 'ready' — which on a
    // Rust-backed preset happens BEFORE the WASM compile finishes,
    // so the first `_init` arrives with an empty parameter list.
    // Metadata lands via a second `_init` once the compile completes.
    function maybeRevealContent() {
      if (CDP.parameters.count > 0) {
        document.body.classList.remove('cdp-loading');
        return true;
      }
      return false;
    }

    function init() {
      FG = resolveFG();
      window.addEventListener('resize', schedule);
      if (!maybeRevealContent()) {
        // Poll for metadata arrival. Cheap — 10 Hz for at most a
        // few seconds while rustc runs. Safety cap at 15s so a
        // genuinely parameterless preset still ends up visible.
        var started = Date.now();
        var poll = setInterval(function () {
          if (maybeRevealContent() || Date.now() - started > 15000) {
            clearInterval(poll);
            if (CDP.parameters.count === 0) {
              document.body.classList.remove('cdp-loading');
            }
          }
        }, 100);
      }
      // Continuous rAF loop: cdp-ui components call parameters.set on
      // local drags which (deliberately) doesn't fire onAnyChange, so
      // we can't rely on change events alone to trigger a redraw.
      function tick() { schedule(); requestAnimationFrame(tick); }
      tick();
    }
    if (CDP && CDP.ready) CDP.ready(init);
    else window.addEventListener('ConjureDSPReady', init);
  })();
  </script>
</body>
</html>
