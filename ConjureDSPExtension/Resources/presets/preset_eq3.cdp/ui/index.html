<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3-Band EQ</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; height: 100%; font: 12px -apple-system, system-ui, sans-serif; background: Canvas; color: CanvasText; }
    body { display: flex; flex-direction: column; padding: 12px 16px; gap: 10px; box-sizing: border-box; }
    canvas { width: 100%; height: 200px; display: block; border-radius: 6px; background: color-mix(in srgb, CanvasText 6%, Canvas); cursor: ns-resize; }
    .legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .band { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; border-radius: 6px; background: color-mix(in srgb, CanvasText 4%, Canvas); }
    .band-head { display: flex; justify-content: space-between; align-items: center; }
    .band-label { font-weight: 600; letter-spacing: 0.02em; }
    .band-freq { font-size: 0.85em; opacity: 0.6; font-variant-numeric: tabular-nums; }
    .band-gain { font-size: 1.1em; font-variant-numeric: tabular-nums; }
    cdp-toggle.band-bypass { --cdp-label-width: 0; --cdp-value-width: 0; flex: 0 0 auto; }
    .band.inactive .band-gain { opacity: 0.35; }
  </style>
</head>
<body>
  <canvas id="response" width="800" height="400"></canvas>
  <div class="legend">
    <div class="band" data-band="low" param="low_gain"><div class="band-head"><span class="band-label">Low</span><cdp-toggle class="band-bypass" param="low_bypass"></cdp-toggle></div><div class="band-freq">200 Hz shelf</div><div class="band-gain">0.00 dB</div></div>
    <div class="band" data-band="mid" param="mid_gain"><div class="band-head"><span class="band-label">Mid</span><cdp-toggle class="band-bypass" param="mid_bypass"></cdp-toggle></div><div class="band-freq">1.0 kHz peak</div><div class="band-gain">0.00 dB</div></div>
    <div class="band" data-band="high" param="high_gain"><div class="band-head"><span class="band-label">High</span><cdp-toggle class="band-bypass" param="high_bypass"></cdp-toggle></div><div class="band-freq">5.0 kHz shelf</div><div class="band-gain">0.00 dB</div></div>
  </div>
  <script>
  (function () {
    const CDP = window.ConjureDSP;
    const canvas = document.getElementById('response');
    const ctx = canvas.getContext('2d');

    // Must match DSP constants in process.py.
    const BANDS = [
      { key: 'low',  freq: 200,  type: 'lowshelf',  gainParam: 'low_gain',  bypassParam: 'low_bypass'  },
      { key: 'mid',  freq: 1000, type: 'peak',      gainParam: 'mid_gain',  bypassParam: 'mid_bypass'  },
      { key: 'high', freq: 5000, type: 'highshelf', gainParam: 'high_gain', bypassParam: 'high_bypass' },
    ];
    const Q = 0.707;
    const SR = 48000;  // response is visualization-only; host SR only shifts Nyquist off-screen.

    // RBJ cookbook biquad coefficients. Returns {b0, b1, b2, a0, a1, a2}.
    function coeffs(type, f0, Q, gainDb, sampleRate) {
      const A = Math.pow(10, gainDb / 40);
      const w0 = 2 * Math.PI * f0 / sampleRate;
      const cosw = Math.cos(w0);
      const sinw = Math.sin(w0);
      const alpha = sinw / (2 * Q);
      let b0, b1, b2, a0, a1, a2;
      if (type === 'peak') {
        b0 = 1 + alpha * A; b1 = -2 * cosw; b2 = 1 - alpha * A;
        a0 = 1 + alpha / A; a1 = -2 * cosw; a2 = 1 - alpha / A;
      } else if (type === 'lowshelf') {
        const beta = 2 * Math.sqrt(A) * alpha;
        b0 =    A * ((A + 1) - (A - 1) * cosw + beta);
        b1 =  2*A * ((A - 1) - (A + 1) * cosw);
        b2 =    A * ((A + 1) - (A - 1) * cosw - beta);
        a0 =        (A + 1) + (A - 1) * cosw + beta;
        a1 =   -2 * ((A - 1) + (A + 1) * cosw);
        a2 =        (A + 1) + (A - 1) * cosw - beta;
      } else { /* highshelf */
        const beta = 2 * Math.sqrt(A) * alpha;
        b0 =    A * ((A + 1) + (A - 1) * cosw + beta);
        b1 = -2*A * ((A - 1) + (A + 1) * cosw);
        b2 =    A * ((A + 1) + (A - 1) * cosw - beta);
        a0 =        (A + 1) - (A - 1) * cosw + beta;
        a1 =    2 * ((A - 1) - (A + 1) * cosw);
        a2 =        (A + 1) - (A - 1) * cosw - beta;
      }
      return { b0: b0/a0, b1: b1/a0, b2: b2/a0, a1: a1/a0, a2: a2/a0 };
    }

    // |H(e^jω)| for the biquad. f in Hz.
    function magnitudeDb(c, f) {
      const w = 2 * Math.PI * f / SR;
      const cw = Math.cos(w), c2w = Math.cos(2*w);
      const sw = Math.sin(w), s2w = Math.sin(2*w);
      const nr = c.b0 + c.b1*cw + c.b2*c2w;
      const ni = -(c.b1*sw + c.b2*s2w);
      const dr = 1 + c.a1*cw + c.a2*c2w;
      const di = -(c.a1*sw + c.a2*s2w);
      const num = nr*nr + ni*ni;
      const den = dr*dr + di*di;
      return 10 * Math.log10(num / den);
    }

    // Canvas 2D doesn't parse `color-mix()` or the `CanvasText` CSS
    // keyword, so we pick an explicit rgb() foreground from the bridge's
    // theme flag. Transparency layered via `globalAlpha`. Re-resolved
    // inside draw() so the initial 'light' default doesn't stick once
    // CDP._init arrives with the real theme.
    function resolveFG() {
      return (CDP && CDP.theme === 'dark') ? 'rgb(232, 232, 232)' : 'rgb(24, 24, 24)';
    }
    let FG = resolveFG();
    window.addEventListener('themechange', () => { FG = resolveFG(); scheduleRedraw(); });

    // Smoothed input/output spectra. Updated by `audio.onFrame` ticks
    // (fft bins arrive when the host produced a new column — limited
    // by the 50% hop, so roughly every fftSize/2 samples). Stored at
    // bin resolution; resampled onto the canvas log-x axis at draw time.
    // Exponential decay = max(prev*0.85, new) gives a "peak hold then
    // fall" feel that's easier to read than raw bin updates.
    let specIn = null;   // Float32Array, halfN bins of dB (-120..0)
    let specOut = null;
    let specBins = 0;
    let specSampleRate = 48000;  // overwritten on first frame via fftSize inference
    const SPEC_FLOOR = -90;      // floor dB shown on canvas (clamps below this)
    const SPEC_CEIL  = 0;        // top dB shown on canvas
    const SPEC_DECAY = 0.85;
    let lastSpecTickRedraw = 0;

    function ingestSpectrum(prev, fresh) {
      const n = fresh.length;
      if (!prev || prev.length !== n) prev = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const decayed = prev[i] * SPEC_DECAY + SPEC_FLOOR * (1 - SPEC_DECAY);
        prev[i] = fresh[i] > decayed ? fresh[i] : decayed;
      }
      return prev;
    }

    if (CDP && CDP.audio && CDP.audio.onFrame) {
      CDP.audio.onFrame((frame) => {
        if (!frame.fftIn || !frame.fftOut) return;
        // Infer FFT size from bin count: AudioCaptureManager passes halfN
        // bins where halfN = fftSize/2. Bin i maps to f = i * SR / fftSize.
        // The canvas only knows the bin index; SR is implicit and the
        // spectrogram math doesn't change if SR drifts off 48k.
        specBins = frame.fftIn.length;
        specIn  = ingestSpectrum(specIn,  frame.fftIn);
        specOut = ingestSpectrum(specOut, frame.fftOut);
        // Throttle spectrum-driven redraws so we don't compete with EQ
        // curve redraws on parameter drag. 33 ms cap = ~30 Hz.
        const now = performance.now();
        if (now - lastSpecTickRedraw < 33) return;
        lastSpecTickRedraw = now;
        scheduleRedraw();
      }, { fft: true });
    }

    // Map a spectrum bin index → log-frequency canvas x. Returns null
    // for bins outside [fMin, fMax].
    function binToX(bin, totalBins, pad, innerW, fMin, fMax) {
      // halfN bins span 0..Nyquist; assume SR=48000 for axis layout (the
      // canvas range goes to 20 kHz, well below Nyquist for any SR ≥ 40k).
      const f = bin * (specSampleRate * 0.5) / totalBins;
      if (f < fMin || f > fMax) return null;
      const t = Math.log(f / fMin) / Math.log(fMax / fMin);
      return pad + t * innerW;
    }

    function drawSpectrum(spec, pad, innerW, innerH, fMin, fMax, fillAlpha, strokeAlpha) {
      if (!spec || specBins === 0) return;
      ctx.beginPath();
      let started = false;
      for (let i = 1; i < specBins; i++) {  // skip DC bin
        const x = binToX(i, specBins, pad, innerW, fMin, fMax);
        if (x === null) continue;
        const dbClamped = Math.max(SPEC_FLOOR, Math.min(SPEC_CEIL, spec[i]));
        const t = (dbClamped - SPEC_FLOOR) / (SPEC_CEIL - SPEC_FLOOR);  // 0..1
        const y = pad + innerH * (1 - t);
        if (!started) { ctx.moveTo(x, pad + innerH); ctx.lineTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
      if (!started) return;
      // Close down to the baseline for fill.
      ctx.lineTo(pad + innerW, pad + innerH);
      ctx.closePath();
      ctx.fillStyle = FG;
      ctx.globalAlpha = fillAlpha;
      ctx.fill();
      // Stroke only the top edge: re-walk without the close-to-baseline.
      ctx.beginPath();
      started = false;
      for (let i = 1; i < specBins; i++) {
        const x = binToX(i, specBins, pad, innerW, fMin, fMax);
        if (x === null) continue;
        const dbClamped = Math.max(SPEC_FLOOR, Math.min(SPEC_CEIL, spec[i]));
        const t = (dbClamped - SPEC_FLOOR) / (SPEC_CEIL - SPEC_FLOOR);
        const y = pad + innerH * (1 - t);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = FG;
      ctx.globalAlpha = strokeAlpha;
      ctx.lineWidth = 1 * devicePixelRatio;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    function drawResponse() {
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;
      if (w === 0 || h === 0) return;
      ctx.clearRect(0, 0, w, h);

      const pad = 8 * devicePixelRatio;
      const innerH = h - pad*2, innerW = w - pad*2;
      const dbRange = 18;  // ±18 dB visible

      // Grid + zero line.
      ctx.strokeStyle = FG;
      ctx.fillStyle = FG;
      ctx.lineWidth = 1;
      ctx.font = `${10 * devicePixelRatio}px -apple-system, sans-serif`;
      const gridDbs = [-12, -6, 0, 6, 12];
      gridDbs.forEach(db => {
        const y = pad + innerH * (0.5 - db / (dbRange * 2));
        ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y);
        ctx.globalAlpha = db === 0 ? 0.4 : 0.15;
        ctx.stroke();
        if (db !== 0) {
          ctx.globalAlpha = 0.5;
          ctx.fillText(db > 0 ? `+${db}` : `${db}`, pad + 2, y - 2);
        }
      });
      ctx.globalAlpha = 1;

      // Live FFT spectra (input behind, output in front), drawn under
      // the EQ curve so the analytical response stays the dominant
      // visual. fillAlpha is intentionally low — when the bands are
      // flat, input ≈ output and the two layers would otherwise look
      // muddy.
      const fMin = 20, fMax = 20000;
      drawSpectrum(specIn,  pad, innerW, innerH, fMin, fMax, 0.08, 0.25);
      drawSpectrum(specOut, pad, innerW, innerH, fMin, fMax, 0.18, 0.55);

      // Compute coefficients per band.
      const activeCoeffs = BANDS.map(b => {
        const gain = CDP.parameters.get(getIndex(b.gainParam));
        const bypassed = CDP.parameters.get(getIndex(b.bypassParam)) >= 0.5;
        return bypassed ? null : coeffs(b.type, b.freq, Q, gain, SR);
      });

      // Sweep log frequency 20 Hz -> 20 kHz (fMin/fMax declared above).
      const N = 256;
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const f = fMin * Math.pow(fMax / fMin, t);
        let totalDb = 0;
        activeCoeffs.forEach(c => { if (c) totalDb += magnitudeDb(c, f); });
        totalDb = Math.max(-dbRange, Math.min(dbRange, totalDb));
        const x = pad + t * innerW;
        const y = pad + innerH * (0.5 - totalDb / (dbRange * 2));
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = FG;
      ctx.lineWidth = 2 * devicePixelRatio;
      ctx.stroke();

      // Band markers.
      BANDS.forEach(b => {
        const t = Math.log(b.freq / fMin) / Math.log(fMax / fMin);
        const x = pad + t * innerW;
        const gain = CDP.parameters.get(getIndex(b.gainParam));
        const bypassed = CDP.parameters.get(getIndex(b.bypassParam)) >= 0.5;
        const y = pad + innerH * (0.5 - (bypassed ? 0 : Math.max(-dbRange, Math.min(dbRange, gain))) / (dbRange * 2));
        ctx.beginPath();
        ctx.arc(x, y, 6 * devicePixelRatio, 0, Math.PI * 2);
        ctx.fillStyle = FG;
        ctx.globalAlpha = bypassed ? 0.25 : 1;
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Frequency tick labels (log 20 Hz – 20 kHz). Drawn last so they
      // sit on top of the curve / FFT fills, with low alpha so they
      // don't dominate.
      ctx.fillStyle = FG;
      ctx.globalAlpha = 0.5;
      ctx.font = `${10 * devicePixelRatio}px -apple-system, sans-serif`;
      [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000].forEach(f => {
        const t = Math.log(f / fMin) / Math.log(fMax / fMin);
        const x = pad + t * innerW;
        const label = f >= 1000 ? `${f / 1000}k` : `${f}`;
        ctx.fillText(label, x + 2, h - pad - 2);
      });
      ctx.globalAlpha = 1;
    }

    // Alnum-only normalization so the same UI file matches across
    // variants: Python emits names like `"low_gain"` (dict key),
    // Rust's `params!` macro Title-Cases the ident to `"Low Gain"`
    // (space, mixed case). Stripping non-alphanumerics + lowercasing
    // lands both at `"lowgain"`.
    function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
    let _nameMap = null;
    function rebuildNameMap() {
      _nameMap = {};
      for (let i = 0; i < CDP.parameters.count; i++) {
        const m = CDP.parameters.metadata(i);
        if (!m) continue;
        if (m.key) _nameMap[norm(m.key)] = i;
        if (m.name) _nameMap[norm(m.name)] = i;
      }
    }
    function getIndex(key) {
      if (!_nameMap) rebuildNameMap();
      return _nameMap[norm(key)];
    }

    // Drag a band's node vertically to set its gain.
    let dragging = null;
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      // Find nearest band in log-x space.
      const fMin = 20, fMax = 20000;
      let nearest = null, nearestDx = 1;
      BANDS.forEach(b => {
        const t = Math.log(b.freq / fMin) / Math.log(fMax / fMin);
        const dx = Math.abs(t - x);
        if (dx < nearestDx) { nearestDx = dx; nearest = b; }
      });
      if (!nearest || nearestDx > 0.18) return;
      dragging = nearest;
      canvas.setPointerCapture(e.pointerId);
      applyDrag(e);
    });
    canvas.addEventListener('pointermove', (e) => { if (dragging) applyDrag(e); });
    const release = (e) => {
      if (!dragging) return;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      dragging = null;
    };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);

    function applyDrag(e) {
      const rect = canvas.getBoundingClientRect();
      const yFrac = (e.clientY - rect.top) / rect.height;
      // -18..+18 visible dB range; clamp to ±12 (the actual param range).
      const db = (0.5 - yFrac) * 36;
      const clamped = Math.max(-12, Math.min(12, db));
      CDP.parameters.set(getIndex(dragging.gainParam), clamped);
      // `parameters.set` deliberately doesn't fire onAnyChange (that path
      // is for EXTERNAL changes only, to avoid slider-drag echo fights).
      // Our visualization depends on a redraw after the local write, so
      // we schedule it manually here. Same story in the bypass click
      // handler below.
      scheduleRedraw();
    }

    function updateLegend() {
      document.querySelectorAll('.band').forEach(row => {
        const band = BANDS.find(b => b.key === row.dataset.band);
        const gain = CDP.parameters.get(getIndex(band.gainParam));
        const bypassed = CDP.parameters.get(getIndex(band.bypassParam)) >= 0.5;
        row.classList.toggle('inactive', bypassed);
        row.querySelector('.band-gain').textContent = (gain >= 0 ? '+' : '') + gain.toFixed(2) + ' dB';
      });
    }

    let raf = 0;
    function scheduleRedraw() {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        drawResponse();
        updateLegend();
      });
    }

    function init() {
      // CDP.theme is only authoritative after _init lands; re-resolve now
      // and rebuild the name map against the now-populated parameter list.
      FG = resolveFG();
      rebuildNameMap();
      CDP.parameters.onAnyChange(scheduleRedraw);
      window.addEventListener('resize', scheduleRedraw);
      scheduleRedraw();
    }

    if (CDP && CDP.ready) CDP.ready(init);
    else window.addEventListener('ConjureDSPReady', init);
  })();
  </script>
</body>
</html>
