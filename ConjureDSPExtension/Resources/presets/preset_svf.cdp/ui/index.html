<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>State Variable Filter</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; height: 100%; font: 12px -apple-system, system-ui, sans-serif; background: Canvas; color: CanvasText; }
    body { display: grid; grid-template-rows: auto 1fr auto; padding: 14px 16px; gap: 10px; box-sizing: border-box; }
    canvas { width: 100%; height: 120px; display: block; border-radius: 6px; background: color-mix(in srgb, CanvasText 6%, Canvas); }
    cdp-xy { --cdp-xy-size: 100%; }
    .pad-wrap { position: relative; display: flex; justify-content: center; align-items: center; }
    .axis { display: flex; justify-content: space-between; font-size: 0.85em; opacity: 0.6; }
    .axis .x { text-align: center; }
    .title { font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; font-size: 0.75em; opacity: 0.55; }
  </style>
</head>
<body>
  <div>
    <div class="title">Frequency response</div>
    <canvas id="response" width="800" height="240"></canvas>
  </div>
  <div class="pad-wrap">
    <cdp-xy param-x="cutoff" param-y="resonance" invert-y style="width: 240px; height: 240px;"></cdp-xy>
  </div>
  <div class="axis">
    <span>20 Hz ← Cutoff → 20 kHz</span>
    <span>Q ↑</span>
  </div>
  <script>
  (function () {
    const CDP = window.ConjureDSP;
    const canvas = document.getElementById('response');
    const ctx = canvas.getContext('2d');
    const SR = 48000;

    function idxOf(key) {
      // Case-insensitive so this UI serves both Python (lowercase)
      // and Rust (uppercase from params!()) variants.
      const low = String(key).toLowerCase();
      for (let i = 0; i < CDP.parameters.count; i++) {
        const m = CDP.parameters.metadata(i);
        if (!m) continue;
        if ((m.name && m.name.toLowerCase() === low) ||
            (m.key && m.key.toLowerCase() === low)) return i;
      }
      return -1;
    }

    // TPT SVF magnitude response (LP output). See Zavalishin; lp/bp/hp are
    // all exact with this topology so magnitude mirrors what the preset
    // actually produces.
    function lpMagnitudeDb(f0, Q, f) {
      const g = Math.tan(Math.PI * f0 / SR);
      const k = 1 / Q;
      // H_lp(s) = g^2 / (s^2 + k*g*s + g^2) with s = j*ω_tan
      const wt = Math.tan(Math.PI * f / SR);
      const gg = g * g;
      const re = gg - wt * wt;
      const im = k * g * wt;
      return 10 * Math.log10(gg * gg / (re * re + im * im));
    }

    // Canvas 2D can't parse `color-mix()` or the `CanvasText` keyword,
    // so we resolve the foreground color via getComputedStyle and use
    // globalAlpha for transparency.
    function resolveFG() { return getComputedStyle(document.body).color || '#fff'; }
    let FG = resolveFG();
    window.addEventListener('themechange', () => { FG = resolveFG(); });

    function drawResponse() {
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;
      if (w === 0 || h === 0) return;
      ctx.clearRect(0, 0, w, h);
      const pad = 6 * devicePixelRatio;
      const iw = w - pad * 2, ih = h - pad * 2;

      // Grid.
      ctx.strokeStyle = FG;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.12;
      [-24, -12, 0, 12].forEach(db => {
        const y = pad + ih * (1 - (db + 30) / 40);
        ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
      });
      ctx.globalAlpha = 1;

      const fMin = 20, fMax = 20000;
      const cutoff = CDP.parameters.get(idxOf('cutoff'));
      const Q = CDP.parameters.get(idxOf('resonance'));
      const fClamped = Math.max(20, Math.min(SR * 0.49, cutoff));

      ctx.beginPath();
      const N = 256;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const f = fMin * Math.pow(fMax / fMin, t);
        const db = Math.max(-30, Math.min(18, lpMagnitudeDb(fClamped, Q, f)));
        const x = pad + t * iw;
        const y = pad + ih * (1 - (db + 30) / 40);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = FG;
      ctx.lineWidth = 2 * devicePixelRatio;
      ctx.stroke();

      // Cutoff marker.
      const tCut = Math.log(fClamped / fMin) / Math.log(fMax / fMin);
      const xCut = pad + tCut * iw;
      ctx.strokeStyle = FG;
      ctx.globalAlpha = 0.35;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(xCut, pad); ctx.lineTo(xCut, h - pad); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    let raf = 0;
    function schedule() {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; drawResponse(); });
    }

    function init() {
      CDP.parameters.onAnyChange(schedule);
      window.addEventListener('resize', schedule);
      schedule();
    }
    if (CDP && CDP.ready) CDP.ready(init);
    else window.addEventListener('ConjureDSPReady', init);
  })();
  </script>
</body>
</html>
