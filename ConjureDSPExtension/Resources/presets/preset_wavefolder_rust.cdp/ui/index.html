<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wavefolder</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; height: 100%; font: 12px -apple-system, system-ui, sans-serif; background: Canvas; color: CanvasText; }
    body { display: grid; grid-template-rows: 1fr auto; padding: 14px 16px; gap: 12px; box-sizing: border-box; }
    .head { display: flex; justify-content: space-between; align-items: baseline; }
    .title { font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; font-size: 0.75em; opacity: 0.55; }
    .drive-val { font-variant-numeric: tabular-nums; font-size: 1.1em; }
    #xfer { width: 100%; height: 100%; display: block; border-radius: 6px; background: color-mix(in srgb, CanvasText 6%, Canvas); }
    .control { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
    .control label { font-size: 0.75em; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
    .control cdp-slider { --cdp-label-width: 0; --cdp-value-width: 0; }
  </style>
</head>
<body>
  <div>
    <div class="head">
      <span class="title">Fold function</span>
      <span class="drive-val" id="driveVal">Drive 5.0×</span>
    </div>
    <canvas id="xfer" width="800" height="500"></canvas>
  </div>
  <div class="control">
    <label>Drive</label>
    <cdp-slider param="drive"></cdp-slider>
    <span id="driveNum" style="font-variant-numeric: tabular-nums; opacity: 0.6;">5.0×</span>
  </div>
  <script>
  (function () {
    const CDP = window.ConjureDSP;
    const canvas = document.getElementById('xfer');
    const ctx = canvas.getContext('2d');

    function idx(key) {
      // Case-insensitive so this UI serves both Python (lowercase)
      // and Rust (uppercase from params!()) variants.
      const low = String(key).toLowerCase();
      for (let i = 0; i < CDP.parameters.count; i++) {
        const m = CDP.parameters.metadata(i);
        if (!m) continue;
        if ((m.name && m.name.toLowerCase() === low) ||
            (m.key && m.key.toLowerCase() === low)) return i;
      }
      return -1;
    }

    // Mirror of the triangle-wave fold used in process.py.
    function fold(v) {
      const t = ((v + 1.0) * 0.25) - Math.floor((v + 1.0) * 0.25);
      return 1.0 - Math.abs(t * 4.0 - 2.0);
    }

    // Peak amplitude of the live input signal, smoothed.
    let smoothedPeak = 0;

    function draw() {
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      const pad = 12 * devicePixelRatio;
      const iw = w - pad * 2, ih = h - pad * 2;

      // Input: -1..+1 (x), output: -1..+1 (y).
      const xAt = (v) => pad + iw * (v + 1) / 2;
      const yAt = (v) => pad + ih * (1 - (v + 1) / 2);

      // Axes.
      ctx.strokeStyle = 'color-mix(in srgb, CanvasText 12%, transparent)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad, yAt(0)); ctx.lineTo(w - pad, yAt(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xAt(0), pad); ctx.lineTo(xAt(0), h - pad); ctx.stroke();

      // 1:1 reference.
      ctx.strokeStyle = 'color-mix(in srgb, CanvasText 18%, transparent)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(xAt(-1), yAt(-1)); ctx.lineTo(xAt(1), yAt(1)); ctx.stroke();
      ctx.setLineDash([]);

      // Fold curve.
      const drive = CDP.parameters.get(idx('drive'));
      ctx.strokeStyle = 'CanvasText';
      ctx.lineWidth = 2.5 * devicePixelRatio;
      ctx.beginPath();
      const N = 400;
      for (let i = 0; i <= N; i++) {
        const inp = -1 + 2 * i / N;
        const y = fold(inp * drive);
        const px = xAt(inp), py = yAt(y);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Live signal indicator: a dot moving along the curve at smoothedPeak.
      if (smoothedPeak > 0.001) {
        const y = fold(smoothedPeak * drive);
        ctx.beginPath();
        ctx.arc(xAt(smoothedPeak), yAt(y), 6 * devicePixelRatio, 0, Math.PI * 2);
        ctx.fillStyle = 'color-mix(in srgb, CanvasText 80%, transparent)';
        ctx.fill();
      }
    }

    function onFrame(frame) {
      const p = frame.peakIn || 0;
      smoothedPeak = smoothedPeak * 0.75 + p * 0.25;
      draw();
    }

    function updateReadouts() {
      const d = CDP.parameters.get(idx('drive'));
      document.getElementById('driveVal').textContent = 'Drive ' + d.toFixed(1) + '×';
      document.getElementById('driveNum').textContent = d.toFixed(1) + '×';
    }

    let raf = 0;
    function schedule() {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; draw(); updateReadouts(); });
    }

    function init() {
      CDP.parameters.onAnyChange(schedule);
      window.addEventListener('resize', schedule);
      CDP.audio.onFrame(onFrame);
      updateReadouts();
      schedule();
    }
    if (CDP && CDP.ready) CDP.ready(init);
    else window.addEventListener('ConjureDSPReady', init);
  })();
  </script>
</body>
</html>
