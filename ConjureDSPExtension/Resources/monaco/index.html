<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        #editor { width: 100%; height: 100%; }

        /* MCP-driven script update flash — whole-line decoration applied across the editor */
        /* Shift from soft purple (#B06EFF) through lavender (#A78BFA) to sky blue (#4FC3F7) */
        @keyframes conjure-mcp-flash-kf {
            0%   { background-color: rgba(176, 110, 255, 0.00); }
            12%  { background-color: rgba(176, 110, 255, 0.38); }
            45%  { background-color: rgba(167, 139, 250, 0.32); }
            75%  { background-color: rgba( 79, 195, 247, 0.22); }
            100% { background-color: rgba( 79, 195, 247, 0.00); }
        }
        .conjure-mcp-flash {
            animation: conjure-mcp-flash-kf 1800ms ease-out;
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script src="vs/loader.js"></script>
    <script src="themes.js"></script>
    <script src="editor-bridge.js"></script>
</body>
</html>
