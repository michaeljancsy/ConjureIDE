[package]
name = "bedrock-vst3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bedrock Track and Bedrock Vision, packaged as a single VST3 module."

[lib]
name = "bedrock"
# rlib as well as cdylib so the crate's own tests and the loader harness can link it.
crate-type = ["cdylib", "rlib"]

[features]
# Compiles the non-native window backends so they can be type-checked from any host.
typecheck-all = []

[dependencies]
bedrock-core.workspace = true
vst3.workspace = true

[dev-dependencies]
libloading = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
libc = "0.2"
