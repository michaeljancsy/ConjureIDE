[package]
name = "bedrock-vst3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bedrock Track and Bedrock Vision, packaged as a single VST3 module."

[lib]
name = "bedrock"
# rlib as well as cdylib so the crate's own tests and the loader harness can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
bedrock-core.workspace = true
vst3.workspace = true

[dev-dependencies]
libloading = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.2", features = [
    "NSView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSBitmapImageRep",
    "NSColor",
    "NSResponder",
] }
