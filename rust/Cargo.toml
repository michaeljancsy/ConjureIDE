[workspace]
members = ["conjure_dsp", "conjuredsp-rs"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Always optimize conjuredsp (NAM inference) even in debug builds.
# Unoptimized NAM is ~15x slower and can't meet real-time deadlines.
[profile.dev.package.conjuredsp]
opt-level = 3
