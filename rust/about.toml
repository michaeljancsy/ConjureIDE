# cargo-about configuration for generating third-party license attribution
# Run: cd rust && cargo about generate about.hbs > ../ConjureDSPExtension/Resources/rust-licenses.json

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    "MPL-2.0",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

# ittapi/ittapi-sys use deprecated SPDX identifier "GPL-2.0" (should be GPL-2.0-only).
# They're dual-licensed GPL-2.0-only OR BSD-3-Clause. Override to BSD-3-Clause.
[ittapi.clarify]
license = "BSD-3-Clause"

[ittapi-sys.clarify]
license = "BSD-3-Clause"
