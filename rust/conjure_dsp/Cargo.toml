[package]
name = "conjure_dsp"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
# No "auto-initialize": python_backend.rs starts the interpreter itself so a
# failed start is a load error instead of a process exit.
pyo3 = "0.27"
numpy = "0.27"
wasmtime = "42"
conjuredsp = { path = "../conjuredsp-rs" }
wat = "1"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand = "0.8"

[[bench]]
name = "process_call_overhead"
harness = false
