[package]
name = "conjure_dsp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["auto-initialize"] }
numpy = "0.27"
wasmtime = "42"
wat = "1"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand = "0.8"

