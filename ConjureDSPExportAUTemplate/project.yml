name: ConjureDSPExportAUTemplate
options:
  bundleIdPrefix: com.ConjureDSP-user
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.3"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: A4R63LAVLS
    ARCHS: arm64

targets:
  ConjureDSPExportAUTemplate:
    type: application
    platform: macOS
    sources:
      - path: ConjureDSPExportAUTemplate
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ConjureDSP-user.ExportTemplate
        CODE_SIGN_ENTITLEMENTS: ConjureDSPExportAUTemplate/ConjureDSPExportAUTemplate.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ConjureDSPExportAUTemplateExtension
        embed: true
        codeSign: true

  ConjureDSPExportAUTemplateExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ConjureDSPExportAUTemplateExtension
        excludes:
          - "*.entitlements"
    info:
      path: ConjureDSPExportAUTemplateExtension/Info.plist
      properties:
        CFBundleDisplayName: ConjureDSPExportAUTemplateExtension
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionAttributes:
            AudioComponents:
              - description: ConjureDSP Export
                factoryFunction: $(PRODUCT_MODULE_NAME).ExportAUViewController
                manufacturer: CONJ
                name: "ConjureDSP: ExportTemplate"
                sandboxSafe: true
                subtype: TMPL
                tags:
                  - Effect
                type: aufx
                version: 1
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ExportAUViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ConjureDSP-user.ExportTemplate.Extension
        CODE_SIGN_ENTITLEMENTS: ConjureDSPExportAUTemplateExtension/ConjureDSPExportAUTemplateExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ConjureDSPExportAUTemplateExtension/Common/ExportAUBridgingHeader.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../rust/include"
        LIBRARY_SEARCH_PATHS:
          - "$(BUILT_PRODUCTS_DIR)"
          - "$(SRCROOT)/../rust/python-dist/lib"
        OTHER_LDFLAGS:
          - "-lconjure_dsp"
          - "-lpython3.14t"
          # libconjure_dsp.a calls into vDSP (Accelerate) via the conjuredsp
          # accel module — NAM wavenet + vec_* helpers. The main extension
          # links Accelerate implicitly via its own Swift imports, but the
          # template has no Swift-side Accelerate calls, so the framework
          # must be linked explicitly.
          - "-framework"
          - "Accelerate"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
          - "@loader_path/../Frameworks"
    preBuildScripts:
      - name: Build Rust
        script: |
          cd "${SRCROOT}/../rust"
          bash build-rust.sh
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/libconjure_dsp.a"
    postBuildScripts:
      - name: Copy Python Dylib
        script: |
          set -euo pipefail
          # Mirrors the main extension's Copy Python Dylib phase — separate
          # copy-skip from always-verify-then-resign so a silent first-time
          # codesign failure can't leave an unsigned dylib in the appex.
          # Hardened runtime rejects unsigned dylibs, and the resulting
          # Py_Initialize abort produces exit 1 with no crash report.
          FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          SRC_DYLIB="${SRCROOT}/../rust/python-dist/lib/libpython3.14t.dylib"
          DST_DYLIB="${FRAMEWORKS_DIR}/libpython3.14t.dylib"
          mkdir -p "${FRAMEWORKS_DIR}"
          if [ ! -f "${SRC_DYLIB}" ]; then
              echo "warning: libpython3.14t.dylib not found at ${SRC_DYLIB}" >&2
              exit 0
          fi
          if [ ! -f "${DST_DYLIB}" ] || [ "${SRC_DYLIB}" -nt "${DST_DYLIB}" ]; then
              cp "${SRC_DYLIB}" "${DST_DYLIB}"
          fi
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              if ! codesign --verify --strict "${DST_DYLIB}" 2>/dev/null; then
                  codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
                      --options runtime --timestamp "${DST_DYLIB}"
              fi
          fi
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libpython3.14t.dylib"

  ConjureDSPExportAUTemplateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ConjureDSPExportAUTemplateTests
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ConjureDSPExportAUTemplateExtension/Common/ExportAUBridgingHeader.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../rust/include"
        LIBRARY_SEARCH_PATHS:
          - "$(BUILT_PRODUCTS_DIR)"
          - "$(SRCROOT)/../rust/python-dist/lib"
        OTHER_LDFLAGS:
          - "-lconjure_dsp"
          - "-lpython3.14t"
          # libconjure_dsp.a calls vDSP/cblas via the conjuredsp accel
          # module — same reason the extension target links Accelerate
          # explicitly. The test target doesn't import Accelerate from
          # Swift, so the implicit framework link doesn't happen.
          - "-framework"
          - "Accelerate"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../rust/python-dist/lib"
          - "@loader_path/../../../ConjureDSPExportAUTemplateExtension.appex/Contents/Frameworks"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ConjureDSPExportAUTemplate.app/Contents/MacOS/ConjureDSPExportAUTemplate"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ConjureDSPExportAUTemplate

schemes:
  ConjureDSPExportAUTemplate:
    build:
      targets:
        ConjureDSPExportAUTemplate: all
        ConjureDSPExportAUTemplateExtension: all
        ConjureDSPExportAUTemplateTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ConjureDSPExportAUTemplateTests
