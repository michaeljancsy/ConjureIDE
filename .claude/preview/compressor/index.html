<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
  margin: 0; padding: 16px;
  background: #1a1a1e; color: #ccc;
  font-family: -apple-system, sans-serif;
  display: flex; gap: 24px; align-items: flex-start;
}
cdp-knob {
  --cdp-accent: #c8a84b;
  --cdp-knob-size: 64px;
}
cdp-knob.large {
  --cdp-knob-size: 90px;
  --cdp-knob-indicator-width: 4px;
}
</style>
</head>
<body>
<script src="bridge-stub.js"></script>
<script src="cdp-ui.js"></script>

<cdp-knob param="0"></cdp-knob>
<cdp-knob param="1" class="large"></cdp-knob>
<cdp-knob param="2" label="Custom Label"></cdp-knob>

<!-- Custom-slotted SVG, driven by --cdp-knob-norm -->
<cdp-knob param="3">
  <svg slot="visual" viewBox="0 0 100 100" aria-hidden="true"
       style="width: 80px; height: 80px;">
    <circle cx="50" cy="50" r="45" fill="#222" stroke="#888" stroke-width="2"/>
    <circle cx="50" cy="50" r="35"
            style="fill: hsl(calc(var(--cdp-knob-norm) * 60), 70%, 30%)"/>
    <line x1="50" y1="50" x2="50" y2="15"
          stroke="#fff" stroke-width="3" stroke-linecap="round"
          style="transform-origin: 50px 50px;
                 transform: rotate(calc(var(--cdp-knob-norm) * 270deg - 135deg))"/>
  </svg>
</cdp-knob>

</body>
</html>
