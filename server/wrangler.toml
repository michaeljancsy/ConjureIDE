name = "conjuredsp-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "api.conjuredsp.com", custom_domain = true },
  { pattern = "conjuredsp.com/download", zone_name = "conjuredsp.com" }
]

[vars]
PADDLE_API_BASE = "https://api.paddle.com"

# Secrets (set via `wrangler secret put`):
# - PADDLE_API_KEY
# - PADDLE_WEBHOOK_SECRET
# - ED25519_PRIVATE_KEY (base64-encoded 32-byte seed)

[[d1_databases]]
binding = "DB"
database_name = "conjuredsp-db"
database_id = "2c4420f2-5b0c-4dc6-b22d-f9082019472c"
