[package]
name = "generate-license"
version = "0.1.0"
edition = "2021"
description = "Ed25519 license key generator for ConjureDSP"

[dependencies]
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
base64 = "0.22"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
